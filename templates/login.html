{% extends 'base.html' %}
{% block title %}Login — GreenSaathi{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="auth-card text-center">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--green),var(--teal));border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="28" height="28"><path d="M17 8C8 10 5.9 16.17 3.82 19.8"/><path d="M9.085 11.2C3.08 13.4 2 18 2 18"/><path d="M19.998 3C19.998 14 10.5 19 4 19"/><circle cx="20" cy="3" r="2"/></svg>
      </div>
      <h2 style="font-family:'DM Serif Display',serif;color:var(--forest)">Welcome back</h2>
      <p class="text-muted mb-4" style="font-size:.88rem">Login to GreenSaathi</p>
      <form method="POST" class="text-start">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required placeholder="you@example.com"/>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••"/>
        </div>
        <button type="submit" class="btn btn-eco-primary w-100 btn-lg justify-content-center">Login</button>
      </form>
      <p class="text-center mt-3 text-muted" style="font-size:.86rem">Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--green);font-weight:700">Register free</a></p>
    </div>
  </div>
</div>
{% endblock %}
