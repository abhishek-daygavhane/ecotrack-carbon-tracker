{% extends 'base.html' %}
{% block title %}Register — GreenSaathi{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="auth-card text-center">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--green),var(--teal));border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="28" height="28"><path d="M17 8C8 10 5.9 16.17 3.82 19.8"/><path d="M9.085 11.2C3.08 13.4 2 18 2 18"/><path d="M19.998 3C19.998 14 10.5 19 4 19"/><circle cx="20" cy="3" r="2"/></svg>
      </div>
      <h2 style="font-family:'DM Serif Display',serif;color:var(--forest)">Join GreenSaathi</h2>
      <p class="text-muted mb-4" style="font-size:.88rem">हरित साथी — Start your green journey</p>
      <form method="POST" class="text-start">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" required placeholder="Your name"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required placeholder="you@example.com"/>
        </div>
        <div class="mb-3">
          <label class="form-label">City</label>
          <input type="text" name="city" class="form-control" required placeholder="Pune, Nashik, Nagpur..."/>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="Min 6 characters"/>
        </div>
        <button type="submit" class="btn btn-eco-primary w-100 btn-lg justify-content-center">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" width="15" height="15"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          Create Account
        </button>
      </form>
      <p class="text-center mt-3 text-muted" style="font-size:.86rem">Already registered? <a href="{{ url_for('login') }}" style="color:var(--green);font-weight:700">Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
